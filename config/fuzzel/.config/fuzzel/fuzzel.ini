# Looks like GNOME's run dialog (Alt+F2)
font=Adwaita Sans:size=11
terminal=ghostty -e
prompt=""
placeholder=Type to search
width=37
lines=8
# the selection sits 2/3 of this in, so 24px from the edge like GNOME
horizontal-pad=36
vertical-pad=24
inner-pad=12
# taller rows also make the icons bigger
line-height=23

[colors]
background=36363aff
text=ffffffff
placeholder=c3c3c4ff
input=ffffffff
match=b4befeff
selection=4b4d54ff
selection-text=ffffffff
selection-match=b4befeff

[border]
width=0
radius=18
selection-radius=8
