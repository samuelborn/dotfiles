# --- General -----------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g focus-events on

# --- Switch tabs: Alt-0 .. Alt-9 (create if missing) -------------------
bind -n M-0 if-shell 'tmux select-window -t :0' '' 'new-window -t :0'
bind -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1'
bind -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2'
bind -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3'
bind -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4'
bind -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5'
bind -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6'
bind -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7'
bind -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8'
bind -n M-9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9'

# --- THEME  — minimal, tabs-only, transparent status bar ---------------
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-right ""
set -g window-status-format "#[fg=darkgray,bg=default] #I #W #[fg=#4a4a4a]#{b:pane_current_path} "
set -g window-status-current-format "#[fg=#000000,bg=lightblue,bold] #I #W #[fg=#5b7a8c,nobold]#{b:pane_current_path} "

# --- Panes: Alt-arrows to move, Alt-Shift-arrows to resize -------------
# Alt-arrows move seamlessly between tmux panes and nvim splits: if the
# focused pane runs nvim, the key is forwarded to it instead.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +g?\\.?(view|l?n?vim?x?)(-wrapped)?(diff)?$'"

bind -n M-Left  if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind -n M-Up    if-shell "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind -n M-Down  if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'

bind -T copy-mode-vi M-Left  select-pane -L
bind -T copy-mode-vi M-Right select-pane -R
bind -T copy-mode-vi M-Up    select-pane -U
bind -T copy-mode-vi M-Down  select-pane -D

bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

bind -n M-h split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"
bind -n M-x kill-pane

# --- Side pane: Alt-c toggles a Claude Code pane on the right ----------
bind -n M-c run-shell "~/.config/tmux/toggle-side-pane.sh"

# --- Copy mode: Alt-s ---------------------------------------------------
bind -n M-s copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
