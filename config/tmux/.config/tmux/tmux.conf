# --- General ---
set -g  mouse on
set -g  history-limit 100000
set -sg escape-time 10
set -g  focus-events on
set -g  renumber-windows on
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# the outer terminal's own cursor color comes out as #008080 instead of the configured one
set -g  cursor-colour "#f5e0dc"
# pass modified keys (e.g. Shift+Enter) through to apps like Claude Code
set -s  extended-keys on
# set -s  extended-keys-format csi-u
# set -as terminal-features ",xterm*:extkeys"

# --- Status bar ---
set -g status-position top
set -g status-style "bg=default,fg=terminal"
set -g status-left ""
set -g status-right ""
set -g window-status-format         "#[fg=white,bg=default]#{?window_zoomed_flag,#[fg=yellow],} #I #{b:pane_current_path} "
set -g window-status-current-format "#[fg=black,bg=blue]#{?window_zoomed_flag,#[bg=yellow],} #I #{b:pane_current_path} "

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind j command-prompt -p "join window:" "join-pane -h -s ':%%'"

# --- Windows ---
bind -n M-0 if-shell 'tmux select-window -t :0' '' 'new-window -t :0 -c "#{pane_current_path}"'
bind -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1 -c "#{pane_current_path}"'
bind -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2 -c "#{pane_current_path}"'
bind -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3 -c "#{pane_current_path}"'
bind -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4 -c "#{pane_current_path}"'
bind -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5 -c "#{pane_current_path}"'
bind -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6 -c "#{pane_current_path}"'
bind -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7 -c "#{pane_current_path}"'
bind -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8 -c "#{pane_current_path}"'
bind -n M-9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9 -c "#{pane_current_path}"'

# --- Panes ---
bind -n M-x kill-pane
bind -n M-z resize-pane -Z
claude='#{P:#{?#{==:#{pane_current_command},claude},#{pane_id},}}'
bind -n M-c if -F "$claude" "run -C 'select-pane -t $claude'" 'split-window -h -l 25% -c "#{pane_current_path}" "command -v direnv >/dev/null && exec direnv exec . claude || exec claude"'
nvim='#{==:#{pane_current_command},nvim}'
bind -n M-Left  if -F "$nvim" 'send-keys M-Left'  'select-pane -L'
bind -n M-Right if -F "$nvim" 'send-keys M-Right' 'select-pane -R'
bind -n M-Up    if -F "$nvim" 'send-keys M-Up'    'select-pane -U'
bind -n M-Down  if -F "$nvim" 'send-keys M-Down'  'select-pane -D'
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5
bind -n C-M-S-Left  split-window -hb -c "#{pane_current_path}"
bind -n C-M-S-Right split-window -h  -c "#{pane_current_path}"
bind -n C-M-S-Up    split-window -vb -c "#{pane_current_path}"
bind -n C-M-S-Down  split-window -v  -c "#{pane_current_path}"

# --- Copy mode ---
set -gw mode-keys vi
bind -n M-s copy-mode
bind -n M-/ copy-mode \; command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v if -F "#{selection_present}" "send-keys -X rectangle-toggle" "send-keys -X begin-selection ; send-keys -X rectangle-on"
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

