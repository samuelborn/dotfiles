# --- General ---
set -g  mouse on
set -g  history-limit 100000
set -sg escape-time 10
set -g  focus-events on
set -g  renumber-windows on
set -g  destroy-unattached on # each terminal gets its own session, so kill it when the window closes
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Pass modified keys (Shift+Enter in Claude Code) through instead of collapsing them to plain Enter
set -s  extended-keys on
set -as terminal-features ",*:extkeys"

# --- Status bar ---
set -g status-position top
set -g status-style "bg=default,fg=terminal"
set -g status-left ""
set -g status-right ""
set -g window-status-format         "#[fg=white,bg=default]#{?window_zoomed_flag,#[fg=yellow],} #I #{b:pane_current_path} "
set -g window-status-current-format "#[fg=black,bg=blue]#{?window_zoomed_flag,#[bg=yellow],} #I #{b:pane_current_path} "

# Prefix is Ctrl+T; press it twice to send a literal Ctrl+T
unbind C-b
set -g prefix C-t
bind C-t send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind j command-prompt -p "join window:" "join-pane -h -s ':%%'"
bind Left  split-window -hb -c "#{pane_current_path}"
bind Right split-window -h  -c "#{pane_current_path}"
bind Up    split-window -vb -c "#{pane_current_path}"
bind Down  split-window -v  -c "#{pane_current_path}"

# --- Windows ---
# Prefix+<num> jumps to that window, creating it if missing
bind 0 if-shell 'tmux select-window -t :0' '' 'new-window -t :0'
bind 1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1'
bind 2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2'
bind 3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3'
bind 4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4'
bind 5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5'
bind 6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6'
bind 7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7'
bind 8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8'
bind 9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9'

# --- Panes ---
bind -n M-x kill-pane
bind -n M-z resize-pane -Z
claude='#{P:#{?#{==:#{pane_current_command},claude},#{pane_id},}}'
bind -n M-c if -F "$claude" "run -C 'select-pane -t $claude'" 'split-window -h -l 25% -c "#{pane_current_path}" "direnv exec . claude"'
nvim='#{==:#{pane_current_command},nvim}'
bind -n C-Left  if -F "$nvim" 'send-keys C-Left'  'select-pane -L'
bind -n C-Right if -F "$nvim" 'send-keys C-Right' 'select-pane -R'
bind -n C-Up    if -F "$nvim" 'send-keys C-Up'    'select-pane -U'
bind -n C-Down  if -F "$nvim" 'send-keys C-Down'  'select-pane -D'
bind -n C-S-Left  resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up    resize-pane -U 5
bind -n C-S-Down  resize-pane -D 5
# Keep pane size ratios when the terminal is resized
set-hook -g window-layout-changed 'run-shell "~/.config/tmux/scale-layout.py #{window_id}"'
set-hook -g window-resized        'run-shell "~/.config/tmux/scale-layout.py #{window_id}"'

# --- Copy mode ---
set -gw mode-keys vi
bind -n M-s copy-mode
bind -n M-/ copy-mode \; command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v if -F "#{selection_present}" "send-keys -X rectangle-toggle" "send-keys -X begin-selection ; send-keys -X rectangle-on"
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

