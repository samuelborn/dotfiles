# --- General ---
set -g  mouse on
set -g  history-limit 100000
set -sg escape-time 10
set -g  focus-events on
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Status bar ---
set -g status-position top
set -g status-style "bg=default,fg=terminal"
set -g status-left ""
set -g status-right ""
set -g window-status-format         "#[fg=white,bg=default] #I #{b:pane_current_path} "
set -g window-status-current-format "#[fg=black,bg=blue] #I #{b:pane_current_path} "

bind o move-window -r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Windows: Alt-0..9, created if missing ---
bind -n M-0 if-shell 'tmux select-window -t :0' '' 'new-window -t :0 -c "#{pane_current_path}"'
bind -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1 -c "#{pane_current_path}"'
bind -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2 -c "#{pane_current_path}"'
bind -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3 -c "#{pane_current_path}"'
bind -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4 -c "#{pane_current_path}"'
bind -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5 -c "#{pane_current_path}"'
bind -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6 -c "#{pane_current_path}"'
bind -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7 -c "#{pane_current_path}"'
bind -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8 -c "#{pane_current_path}"'
bind -n M-9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9 -c "#{pane_current_path}"'

# --- Panes: Alt-arrows go to nvim splits first ---
is_vim='#{m/r:^(n?vim|view)$,#{pane_current_command}}'
bind -n M-Left  if-shell -F "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind -n M-Right if-shell -F "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind -n M-Up    if-shell -F "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind -n M-Down  if-shell -F "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5
bind -n M-h split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"
bind -n M-x kill-pane

# --- Copy mode ---
set -gw mode-keys vi
bind -n M-s copy-mode
bind -n M-/ copy-mode \; command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v if-shell -F "#{selection_present}" "send-keys -X rectangle-toggle" "send-keys -X begin-selection ; send-keys -X rectangle-on"
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Side pane: Alt-c toggles Claude Code on the right ---
bind -n M-c run-shell "~/.config/tmux/toggle-side-pane.sh"
