config-version = 2
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# refresh the SwiftBar workspace indicator (config/swiftbar)
exec-on-workspace-change = ['/usr/bin/open', '-g', 'swiftbar://refreshplugin?name=aerospace']

[gaps]
inner = { horizontal = 0, vertical = 0 }
outer = { left = 0, bottom = 0, top = 0, right = 0 }

[mode.main.binding]
alt-d = 'exec-and-forget open ~'
alt-t = '''exec-and-forget pgrep -xq ghostty && osascript -e 'tell application "Ghostty" to new window'; open -a Ghostty'''
alt-w = '''exec-and-forget pgrep -xq Safari && osascript -e 'tell application "Safari" to make new document'; open -a Safari'''
alt-q = 'close --quit-if-last-window'

alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'

ctrl-alt-left = 'focus left'
ctrl-alt-down = 'focus down'
ctrl-alt-up = 'focus up'
ctrl-alt-right = 'focus right'
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

alt-minus = 'resize smart -50'
alt-keypadPlus = 'resize smart +50'

alt-0 = 'workspace 0'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 0'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

[workspace-to-monitor-force-assignment]
0 = ['P34w', 'secondary']
1 = ['P34w', 'secondary']
2 = ['P34w', 'secondary']
3 = ['P34w', 'secondary']
4 = ['P34w', 'secondary']
5 = ['P34w', 'secondary']
6 = ['P34w', 'secondary']
7 = 'built-in'
8 = 'built-in'
9 = 'built-in'

# Fixed-width window, can't fill a tile
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
