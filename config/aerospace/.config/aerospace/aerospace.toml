config-version = 2
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner = { horizontal = 8, vertical = 8 }
outer = { left = 8, bottom = 8, top = 8, right = 8 }

[mode.main.binding]
ctrl-cmd-d = 'exec-and-forget open ~'
ctrl-cmd-t = '''exec-and-forget pgrep -xq ghostty && osascript -e 'tell application "Ghostty" to new window'; open -a Ghostty'''
ctrl-cmd-w = '''exec-and-forget pgrep -xq Safari && osascript -e 'tell application "Safari" to make new document'; open -a Safari'''

alt-h = 'layout horizontal'
alt-v = 'layout vertical'
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'

alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

ctrl-alt-left = 'resize width -50'
ctrl-alt-right = 'resize width +50'
ctrl-alt-up = 'resize height -50'
ctrl-alt-down = 'resize height +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Fixed-width window, can't fill a tile
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Tabs titlebar makes AeroSpace mistake Ghostty windows for dialogs
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'
